<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apple Hello Animation</title>
    <link rel="preload"
        href="https://cdn.jsdelivr.net/gh/npwitk/Macintosh-Skeletal-Filled@main/fonts/MacintoshSkeletalFilled.otf"
        as="font" type="font/otf" crossorigin />
    <style>
        @font-face {
            font-family: 'Macintosh Skeletal Filled';
            src: url('https://cdn.jsdelivr.net/gh/npwitk/Macintosh-Skeletal-Filled@main/fonts/MacintoshSkeletalFilled.otf') format('opentype');
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
        }

        .bg {
            min-height: 100vh;
            background: linear-gradient(135deg, #c8d9fa 0%, #6c97e0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main_div {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main_svg {
            width: 100%;
            height: auto;
            overflow: visible;
        }
        .glass {
            position: relative;
            z-index: 2;
            width: min(900px, 90vw);
            padding: 56px 40px 48px;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.28);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.65);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.8),
                inset 0 -1px 0 rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .glass::before {
            content: "";
            top: 0; left: 20px; right: 20px;
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.9), transparent);
        }

        .apple-text {
            font-family: 'Macintosh Skeletal Filled', sans-serif;
            font-size: 130px;
            fill: transparent;
            stroke: #ffffff;
            stroke-width: 2px;
            stroke-linecap: butt;
            stroke-linejoin: round;

            stroke-dasharray: 2000;
            stroke-dashoffset: 2000;

            opacity: 0;
            will-change: stroke-dashoffset, fill;
        }

        .apple-text.draw {
            opacity: 1;
            animation: appleDraw 6s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
        }

        @keyframes appleDraw {
            0% {
                stroke-dashoffset: 2000;
                fill: transparent;
            }

            60% {
                stroke-dashoffset: 0;
                fill: transparent;
            }

            80%,
            100% {
                stroke-dashoffset: 0;
                fill: #ffffff;
            }
        }
    </style>
</head>

<body>
    <div class="bg">
        <div class="glass">
            <div class="main_div">
                <svg class="main_svg" viewBox="0 0 1000 300">
                    <text x="50%" y="60%" text-anchor="middle" class="apple-text">hpahm.top</text>
                </svg>
            </div>
        </div>
    </div>

    <script>
        document.fonts.ready.then(() => {
            const textElement = document.querySelector('.apple-text');
            if (textElement) {
                textElement.classList.add('draw');
            }
        });
    </script>
</body>

</html>
